{% extends 'base.html' %}
{% block content %}

<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Register</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
  <body>
    <h2>Register</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <ul class="flashes">{% for m in messages %}<li>{{ m }}</li>{% endfor %}</ul>
      {% endif %}
    {% endwith %}
    <form method="post">
      <label>Login (unique): <input name="username"></label><br>
      <label>Display name: <input name="display"></label><br>
      <label>Password: <input type="password" name="password"></label><br>
      <label>Confirm password: <input type="password" name="confirm"></label><br>
      <button>Register</button>
    </form>
    <p><a href="{{ url_for('index') }}">Home</a></p>
  </body>
</html>

{% endblock %}
