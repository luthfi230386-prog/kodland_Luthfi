{% extends 'base.html' %}
{% block content %}

<style>
body {
  margin: 0;
  padding: 0;
  font-family: "Poppins", sans-serif;
  background: linear-gradient(135deg, #4b0087, #9a00d4, #ff55c6);
  background-size: 300% 300%;
  animation: bgFlow 12s ease infinite;
}

@keyframes bgFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.quiz-card {
  max-width: 600px;
  margin: 80px auto;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(15px);
  border-radius: 20px;
  padding: 25px 35px;
  color: white;
  box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  animation: fadeIn 1s ease both;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

label {
  display: block;
  padding: 10px 14px;
  margin: 10px 0;
  border-radius: 12px;
  background: rgba(255,255,255,0.15);
  cursor: pointer;
  transition: 0.25s;
}

label:hover {
  background: rgba(255,255,255,0.28);
  transform: scale(1.02);
}

button {
  margin-top: 18px;
  padding: 10px 18px;
  border: none;
  border-radius: 12px;
  background: #ffb3f4;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: white;
  color: #9a00d4;
  transform: scale(1.03);
}

h3 {
  text-align: center;
  margin-bottom: 15px;
  font-weight: 700;
  letter-spacing: 1px;
}

#timer {
  text-align: center;
  font-size: 20px;
  margin-bottom: 15px;
  font-weight: 600;
}
</style>

<div class="quiz-card">

  <div id="timer">Time Left: <span id="time">60</span>s</div>

  <h3>Question {{ index }} of {{ total }}</h3>

  <form id="quizForm" method="post" action="{{ url_for('quiz_question') }}">

    <p style="font-size: 18px; font-weight: 600;">
      {{ q['question'] }}
    </p>

    {% for opt in options %}
    <label><input type="radio" name="choice" value="{{ loop.index0 }}"> {{ opt }}</label>
    {% endfor %}

    <button type="submit">Submit</button>

  </form>
</div>

<script>
let duration = 60;
let timer = setInterval(function() {
    document.getElementById("time").innerText = duration;
    duration--;

    if (duration < 0) {
        clearInterval(timer);
        document.getElementById("quizForm").submit();
    }
}, 1000);
</script>

{% endblock %}
