{% extends 'base.html' %}
{% block content %}

<style>

body {
  background: url('https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1350&q=80')
              center/cover fixed;
  animation: galaxyMove 35s linear infinite;
  color: #fff;
  font-family: 'Orbitron', sans-serif;
}

@keyframes galaxyMove {
  0%   { background-position: 0% 0%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 0%; }
}

.particle {
  position: fixed;
  width: 6px;
  height: 6px;
  background: rgba(0,255,255,0.7);
  box-shadow: 0 0 8px #0ff, 0 0 14px #0ff;
  border-radius: 50%;
  pointer-events: none;
  animation: floatUp linear infinite;
  z-index: -1;
}

@keyframes floatUp {
  from { transform: translateY(100vh) scale(0.7); opacity: 1; }
  to   { transform: translateY(-10vh) scale(1.3); opacity: 0; }
}

.leaderboard-container {
  max-width: 750px;
  margin: 60px auto;
  padding: 25px;
  background: rgba(10, 10, 25, 0.65);
  border: 2px solid rgba(0,255,255,0.4);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  box-shadow: 0 0 20px #0ff, inset 0 0 15px rgba(0,255,255,0.3);
  animation: fadeIn 0.8s ease forwards;
}

.leaderboard-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  color: #fff;
}

.leaderboard-table th {
  background: rgba(0,255,255,0.25);
  padding: 14px;
  font-size: 17px;
  border-bottom: 2px solid #0ff;
  text-shadow: 0 0 6px #0ff;
}

.leaderboard-table td {
  padding: 14px;
  font-size: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}

.leaderboard-table tr:hover {
  background: rgba(0,255,255,0.15);
  transform: scale(1.01);
  transition: 0.25s ease;
}

/* RANK NUMBER NEON BLINK */
.rank {
  font-weight: bold;
  color: #00eaff;
  text-shadow: 0 0 8px #00eaff, 0 0 14px #00eaff;
  animation: blink 1.5s ease-in-out infinite alternate;
}

@keyframes blink {
  from { opacity: 0.6; }
  to   { opacity: 1; }
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    for (let i = 0; i < 40; i++) {
        let p = document.createElement("div");
        p.className = "particle";
        p.style.left = Math.random() * 100 + "vw";
        p.style.animationDuration = (5 + Math.random() * 8) + "s";
        p.style.opacity = Math.random();
        document.body.appendChild(p);
    }
});
</script>

<div class="leaderboard-container">
  <h2 style="text-align:center; margin-bottom:10px; text-shadow:0 0 10px #0ff;">
    ★ Leaderboard ★
  </h2>

  <table class="leaderboard-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Player</th>
        <th>Score</th>
      </tr>
    </thead>

    <tbody>
      {% for r in rows %}
      <tr>
        <td class="rank">{{ loop.index }}</td>
        <td>{{ r['display'] }}</td>
        <td>{{ r['score'] }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <p style="text-align:center; margin-top:20px;">
    <a href="{{ url_for('index') }}" style="color:#0ff; text-shadow:0 0 6px #0ff;">
      Home
    </a>
  </p>
</div>

{% endblock %}
